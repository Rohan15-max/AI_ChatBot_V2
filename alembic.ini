# A generic, single database configuration.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# FIX: removed the hardcoded sqlalchemy.url line that was here:
#   sqlalchemy.url = postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}/${POSTGRES_DB}
#
# Plain alembic.ini does NOT perform ${VAR} shell-style interpolation —
# that syntax only works in docker-compose.yml files and similar tools
# that explicitly support it. Alembic would have read that line completely
# literally, including the literal characters "${POSTGRES_USER}" etc.,
# and failed to connect to anything resembling a real database the moment
# `alembic upgrade head` actually ran.
#
# THE REAL FIX lives in alembic/env.py, not here. The standard, correct
# pattern is to NOT hardcode a URL in this file at all, and instead set it
# programmatically inside env.py using the exact same settings object
# app.py and database.py already use — so there's one source of truth for
# the connection string, not two separate places that can drift apart.
#
# Add this near the top of alembic/env.py (after its existing imports,
# before the URL is first used by run_migrations_offline/online):
#
#     import sys
#     from pathlib import Path
#     sys.path.insert(0, str(Path(__file__).resolve().parents[1]))  # project root, so `config` is importable
#     from config import get_settings
#
#     settings = get_settings()
#     config.set_main_option("sqlalchemy.url", settings.postgres_url)
#
# This was NOT done here automatically because alembic/env.py was never
# shared in this review — env.py's existing structure (especially how it
# currently builds engine_from_config / the target_metadata wiring) needs
# to be seen before safely editing it, rather than guessing at its
# contents and risking silently replacing something that already works in
# a different but valid way. Apply the three lines above by hand, in the
# right place for your actual env.py.

[post_write_hooks]
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = -l 100

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S