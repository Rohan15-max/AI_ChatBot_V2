apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-chatbot
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ai-chatbot
  template:
    metadata:
      labels:
        app: ai-chatbot
    spec:
      containers:
      - name: app
        image: your-registry/ai-chatbot:latest
        ports:
        # FIX: the Dockerfile's gunicorn binds to 0.0.0.0:5000 (EXPOSE 5000,
        # CMD --bind 0.0.0.0:5000). This was set to 8000, which doesn't
        # match anything the container actually listens on — every pod
        # would fail both probes below immediately and get stuck in a
        # crash/restart loop without ever serving traffic.
        - containerPort: 5000
        envFrom:
        - secretRef:
            name: app-secrets
        resources:
          requests: { memory: "512Mi", cpu: "250m" }
          limits: { memory: "1Gi", cpu: "500m" }
        livenessProbe:
          # FIX: port updated to match containerPort above (5000).
          httpGet: { path: /health, port: 5000 }
          initialDelaySeconds: 30
        readinessProbe:
          # FIX: path was /ready, which doesn't exist anywhere in the app —
          # monitoring.py registers /health, /health/liveness,
          # /health/readiness, and /health/detailed, but no bare /ready.
          # Every pod would permanently fail readiness (404) and never
          # receive traffic even once healthy. /health/readiness is the
          # correct route — it specifically checks DB connectivity (with a
          # 5s timeout) before returning 200, which is exactly what a
          # readiness probe should verify (vs. liveness, which only checks
          # the process is alive). Port updated to 5000 to match.
          httpGet: { path: /health/readiness, port: 5000 }
          initialDelaySeconds: 15
          periodSeconds: 10